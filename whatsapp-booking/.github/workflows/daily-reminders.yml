name: Daily WhatsApp Reminders

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminders endpoint
        run: |
          curl -sf "https://whatsapp-booking-osmf.onrender.com/run-reminders?key=${{ secrets.REMINDER_SECRET }}"
