<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Timetable Maker — Upload & Generate</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main>
      <h1>Timetable Maker</h1>

      <section class="panel">
        <h2>Upload PDF</h2>
        <form id="upload-form">
          <input type="file" id="file" name="file" accept="application/pdf" />
          <button type="submit">Upload & Generate</button>
        </form>
        <pre id="result" class="result">No action yet.</pre>
      </section>

      <section class="panel">
        <h2>Parsed Entries</h2>
        <pre id="parsed" class="parsed">(parsed output will appear here)</pre>
      </section>

      <section class="panel">
        <h2>Timetable</h2>
        <div id="timetable" class="timetable">(solution will appear here)</div>
      </section>

    </main>
    <script src="/static/script.js"></script>
  </body>
</html>
