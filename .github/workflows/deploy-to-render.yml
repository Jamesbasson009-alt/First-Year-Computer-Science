name: Deploy to Render (when secrets present)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "secrets.RENDER_API_KEY != '' && secrets.RENDER_OWNER_ID != ''"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          REPO: "https://github.com/${{ github.repository }}"
        run: |
          echo "Preparing Render service payload"
          cat > /tmp/payload.json <<JSON
{ "type": "web_service",
  "name": "timetable-maker",
  "ownerId": "${RENDER_OWNER_ID}",
  "repo": "${REPO}",
  "branch": "main",
  "serviceDetails": {
    "runtime": "python",
    "envSpecificDetails": {
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    },
    "plan": "starter",
    "region": "oregon",
    "buildPlan": "starter",
    "healthCheckPath": "/",
    "openPorts": [ { "port": 10000, "protocol": "TCP" } ]
  },
  "rootDir": "Timetable Maker"
}
JSON
          echo "Calling Render API to create service (idempotent if exists)"
          HTTP_STATUS=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" \
            -X POST https://api.render.com/v1/services \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)
          echo "Render API status: $HTTP_STATUS"
          cat /tmp/render_resp.json || true
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Render API returned error status $HTTP_STATUS"; exit 1
          fi
